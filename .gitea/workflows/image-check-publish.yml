name: Docker Image CI

# No `pull_request` trigger here on purpose. This workflow pushes :latest to the Gitea
# registry, and :latest is the tag production follows: the deployed container carries
# `io.portainer.update.enable=true` (see docker-compose.yml), so Portainer's own image updater
# polls that tag and redeploys whatever lands on it. A build off a PR branch must never be able
# to move it. PRs are covered by tests.yml, which runs the identical tests, builds the identical
# image and runs the identical gate, but never logs in and never pushes.
#
# That is also what makes the gate below load-bearing rather than decorative: nobody presses a
# button between `docker push` and the rollout, so the smoke test is the last point at which a
# broken image can still be stopped.
#
# The workflow this replaces — .github/workflows/ghcr-check-publish.yml, pushing
# `ghcr.io/vvzvlad/smarthome_floorplan` — got four things wrong, and they are worth naming
# because this file is the fix for each:
#   * it had NO gate between building and publishing. It ran the backend tests (which is more
#     than most of the fleet's old workflows did), then a separate job checked out, built and
#     pushed — so nothing ever looked at the ARTEFACT. Everything the tests prove, they prove
#     about a checkout: they never once start the image, and the frontend was not tested at
#     all, so a stage-one build that silently produced an empty `dist` shipped a blank page
#     with a green tick on it;
#   * it pushed :latest FIRST and :<sha> second, so a push that failed half-way left production
#     running a commit whose immutable twin — the only rollback point — never reached the
#     registry;
#   * it logged in to the registry BEFORE building, i.e. before running arbitrary RUN
#     instructions on a self-hosted runner shared with every other repository;
#   * it ran on `pull_request` as well as push. The push step did carry
#     `if: github.event_name != 'pull_request'`, so a PR did not publish — but it still logged
#     in to the registry with a PR's credentials and still built, and a guard written as an
#     `if:` on one step is one edit away from not being there.
#
# It also installed python with `actions/setup-python`, which is deliberately absent here and
# in tests.yml: that action is unverified on this runner, and a setup action that quietly does
# not work produces a job that passes having checked nothing at all. Both test jobs below run
# inside containers started by the same docker the build uses, so "the tests ran" and "docker
# works on this runner" are the same statement.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea Actions —
# the built-in GITEA_TOKEN carries no package scope at all. The registry push below
# authenticates with the REGISTRY_TOKEN PAT (an organisation-level secret on `projects`,
# inherited by this repo) instead.
permissions:
  contents: read   # checkout

# Two pushes to the same branch in a row must not race: the runs are independent and the older
# one may finish last, leaving ITS :latest on the registry — the next poll by Portainer's
# updater would then ship the previous commit.
# The group alone already fixes that: runs are serialised, so the newest commit's :latest is
# written last. Cancelling is deliberately OFF — it would kill the older run together with its
# :<sha> image, and on two quick pushes the intermediate commit would never be built, leaving
# holes in the tag history exactly where a rollback is most likely to be needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The two test jobs are separate rather than two steps of one job so that a backend failure
  # and a frontend failure are reported independently and can be re-run independently — and so
  # that neither hides behind the other, which is what sequential steps in one job do. They
  # cost two of the shared runner's capacity slots while they run; that is the trade, and it is
  # bounded by their timeouts below.
  backend-tests:
    runs-on: ubuntu-latest
    # The runner is shared by every repository in the fleet, so a hung step does not just stall
    # this run — it holds a capacity slot everyone else is queueing for. 25 is the outer bound
    # over the single 20-minute step below, leaving room for checkout: it must EXCEED the sum,
    # because act_runner kills the whole job when this fires.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the backend test suite in a container
      # 20 minutes is far above the real cost: `pip install` of six pinned runtime wheels plus
      # pytest/httpx, then 198 tests that touch no network and no disk outside tmp_path — a
      # couple of minutes cold. The bound is for a shared runner under load and for the pip
      # index having a bad day.
      timeout-minutes: 20
      env:
        # python:3.11-slim, the SAME base the Dockerfile's runtime stage uses. Testing under a
        # different interpreter than the one that ships would leave exactly the gap this whole
        # migration is about: a suite that is green on 3.12 and an image that runs 3.11.
        RUNTIME_IMAGE: python:3.11-slim
      run: |
        set -e
        set -o pipefail
        # The workspace is streamed into the container as a tar over stdin rather than
        # bind-mounted, and that is not a stylistic choice. This job runs INSIDE act_runner's
        # own job container, while `docker` talks to the HOST's daemon through the mounted
        # socket — so a `-v "$PWD:/src"` would ask the host to mount a path that means
        # something entirely different there, or nothing at all, depending on how the runner
        # was configured to hold the workspace. A tar over stdin is correct in every one of
        # those configurations, and it also keeps the container from writing __pycache__ and
        # .pytest_cache back into the checkout as root.
        # `.git` is excluded because nothing in the test suite reads it and it is the largest
        # thing in the tree.
        # `--pull always`: unlike GitHub's ephemeral runners this daemon is persistent, so
        # without it a once-pulled python:3.11-slim would sit in its cache for months and the
        # tests would run against an unpatched base — the same reason `docker build --pull`
        # carries the flag.
        # The three variables are what `server/src/settings.py` needs to be importable at all:
        # AUTH_PASSWORD and MQTT_HOST have no defaults, and COOKIE_SECURE has to be false
        # because `cookie_secure` defaults to True and Starlette's TestClient speaks plain
        # http, where a Secure cookie is issued and then dropped. server/tests/conftest.py
        # sets the same three with `setdefault`, so they are belt and braces — and they are
        # written out here anyway, because they are the contract the deployment has to satisfy
        # and a conftest is free to stop defaulting them tomorrow.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e AUTH_PASSWORD=test-password \
          -e MQTT_HOST=localhost \
          -e COOKIE_SECURE=false \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r server/requirements-dev.txt; pytest --tb=short -q'

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the frontend test suite in a container
      # 20 minutes, dominated by `npm ci` pulling the dependency tree cold; vitest itself runs
      # the whole suite in a couple of seconds.
      timeout-minutes: 20
      env:
        # node:22-alpine, the SAME image the Dockerfile's frontend stage builds in. It matters
        # more here than for python: alpine is musl, so npm resolves the musl build of
        # rollup's native binary, and a test job on a glibc node would be exercising a
        # different toolchain than the one that produces the bundle that ships.
        FRONTEND_IMAGE: node:22-alpine
      run: |
        set -e
        set -o pipefail
        # Same tar-over-stdin reasoning as the backend job above — see the comment there.
        # `npx vitest run` rather than `npm test` so the command is visible here; they are the
        # same thing (package.json's "test" script is `vitest run`).
        # The playwright suite in e2e/ is deliberately NOT run, and its absence is a decision
        # rather than an oversight: it needs real browsers, which means either a
        # `playwright install` of a few hundred MB on every run of a runner the whole fleet
        # shares, or a `mcr.microsoft.com/playwright` image of comparable size. It is minutes
        # of download for three specs, on a gate that is supposed to answer quickly enough
        # that people wait for it. vitest.config.ts already excludes `e2e/**` from this run, so
        # nothing here silently half-runs them either.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e CI=true \
          "$FRONTEND_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; npm ci; npx vitest run'

  build:
    # Both suites must be green before an image is built at all: a build that starts while the
    # tests are still running is a build whose result nobody can act on, and on a shared runner
    # it is also a slot taken from a job that could have used it.
    needs: [ backend-tests, frontend-tests ]
    # `ubuntu-latest` is a LABEL, not a machine: the instance-level runner registered in Gitea
    # advertises it and serves every repository on the instance. Writing the runner's own name
    # here would leave the job queued forever, because no runner offers a label by that name.
    runs-on: ubuntu-latest
    # The three step-level timeouts below come to 47 minutes (20 build + 12 smoke + 15 push);
    # 55 leaves 8 on top for checkout, the registry login and the two cleanup steps. The outer
    # bound has to EXCEED the sum, not equal it: act_runner kills the whole job when this
    # fires, and a step marked `if: always()` is not guaranteed to run afterwards — so a job
    # that dies mid-push leaves the smoke containers and a few hundred MB of image sitting on
    # the daemon the entire fleet shares.
    timeout-minutes: 55
    # Job-level, so the smoke step and the cleanup step below cannot disagree about it. They
    # are the two ends of the same mechanism — ci/smoke.py names its two containers after this,
    # the cleanup step removes them by the same name — and written as two separate literals
    # they would go on looking correct while one of them was edited, turning the cleanup into a
    # step that removes nothing and reports success.
    # The run id is what keeps concurrent runs on this shared daemon from colliding, and
    # ci/smoke.py refuses to start without this variable rather than falling back to a
    # constant, which would reintroduce exactly that collision.
    env:
      SMOKE_NAME: smarthome-floorplan-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); ANY other branch -> :<branch>.
      # The branch name in the check below and the `branches:` filter at the top of this file
      # must both name the repo's REAL default branch, and they move together or not at all.
      # Renaming that branch invalidates both of them — and, outside this file, the
      # `pull_request` filter in tests.yml. Neither mismatch fails loudly, which is the danger:
      # a `branches:` filter naming a branch that does not exist stops pushes from triggering
      # this workflow at all — only a manual dispatch still runs it, and it still publishes —
      # while a wrong name in the check below leaves it building happily on every push and
      # never once producing the :latest that production actually pulls. Neither puts anything
      # red in the run list, which is what makes both indistinguishable from a gate that
      # passes.
      # Only main is pushed to by the trigger above, but workflow_dispatch can be fired off any
      # ref, so the else branch still has to be correct.
      # Do NOT hardcode a fixed tag in the else branch: a build off a side branch would then
      # silently overwrite the tag production deploys from — one typo away from shipping
      # unreviewed code straight into the running service.
      env:
        # Passed through the environment instead of being interpolated into the script text:
        # git allows `$`, backticks, quotes and parentheses in branch names, so a branch like
        # `feat/$(id)` would otherwise execute on the runner, which is self-hosted and shared
        # with every other repository on the instance.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not accept them in an
        # image path — a repo like `SmartHome_Floorplan` would fail the build with `invalid
        # reference format`, so lowercase it here. Owner and name both come from $REPO, which
        # makes this `gitea.vvzvlad.xyz/projects/smarthome_floorplan` and keeps the file free of
        # a hand-written path that could drift from where the repo lives. The GHCR workflow
        # this replaces derived its path the same way — `ghcr.io/` plus the same
        # github.repository expression — which is why docker-compose.yml, whose `image:` line
        # WAS hand-written, still pointed at ghcr.io long after the move.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters and must not be "tidied up": the push step iterates over $TAGS
          # left to right, so :latest is pushed LAST and acts as the commit of the whole
          # publication. If :<sha> fails to push (network, registry quota, disk), the run stops
          # before :latest moves and production keeps running the previous image. The reverse
          # order — which is what the GHCR workflow this replaces did — publishes a :latest
          # that the updater deploys while its immutable :<sha> twin, the only rollback point,
          # never made it to the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The :<sha> one is
          # it — :latest is a moving target shared with whatever ran before, :<sha> can only
          # ever mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside [A-Za-z0-9_.-]
          # (a `/` in feat/foo above all) becomes `-`, and the result is cut to 100 chars —
          # branch names have no length limit, docker rejects tags over 128. The `sed` fixes
          # the first character: docker requires a tag to match
          # [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, so a branch like `-fix`, `(test)` or `+wip`
          # would otherwise produce a leading `-` and fail the build with `invalid reference
          # format`.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # The sanitiser passes a name through untouched when it already consists of legal
          # characters, so a branch literally named `latest` would come out as the production
          # tag and — one manual workflow_dispatch later — ship unreviewed code into the stack.
          # The `main` check above does not cover this: the branch is not `main`, it only
          # borrows its tag.
          # Reserved names are therefore prefixed instead of being used as-is.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner; the
      # job-level one above is only the outer bound. 20 minutes is well above a realistic cold
      # build, and this Dockerfile is the fleet's most expensive: stage one is node:22-alpine
      # doing `npm ci` over a lockfile of ~300 packages and then `vue-tsc -b && vite build`
      # (the type-check is part of the build, so a type error fails the image rather than
      # shipping), stage two is python:3.11-slim with six pinned wheels on top.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated into the script text: the only thing
        # standing between a branch name and command execution on the runner is the `tr` filter
        # in the step above. `$TAGS` below is intentionally unquoted — the tags are a
        # space-separated list and word splitting is exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required here: unlike GitHub's ephemeral runners, this runner is
        # self-hosted with a persistent docker daemon, so without the flag the once-pulled
        # node:22-alpine and python:3.11-slim would sit in its cache for months and every build
        # would inherit two unpatched base layers.
        # Note that this IS a BuildKit build even though no `docker buildx` appears on the
        # line: BuildKit has been `docker build`'s default since Engine 23.0. It caches into
        # its own builder store, which is why the cleanup step at the end of this job cannot
        # reclaim everything — see the caveat there.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate. It sits BETWEEN build and push on purpose: a red smoke means nothing ever
      # reaches the registry, so production keeps running the previous image. The GHCR workflow
      # this replaces had nothing in this position at all — its tests ran against a checkout in
      # a different job, and the image was pushed by the step after the one that built it.
      #
      # ci/smoke.py is split in two, and the split is worth knowing before editing either half.
      # It runs on the RUNNER and drives `docker` itself, because several of its checks are
      # about the container as an object — how the image behaves with no environment, what
      # `docker inspect` says its CMD and WORKDIR are, whether the container is still alive at
      # the end, and what it wrote to its log — and none of those can be answered from a process
      # already running inside it. Everything that speaks HTTP lives in a probe it feeds to
      # `docker exec -i <name> python -u -`, so those requests are made from INSIDE the
      # container, against 127.0.0.1:8000 where uvicorn actually listens.
      #
      # NO PORT IS PUBLISHED, and that is not an omission. This job runs inside act_runner's own
      # job container while `docker` drives a daemon outside it, so a published port lands in
      # that daemon's network namespace and is not reachable from here — the first version of
      # this gate did publish one, and every HTTP check came back `Connection refused` against a
      # container that was up and serving. It is the same reasoning that makes the test jobs
      # above stream the workspace in over stdin instead of bind-mounting it.
      #
      # `python3` is present in the runner's job image `docker.gitea.com/runner-images:
      # ubuntu-latest`; note that a bare `python` is NOT, which is why the command below spells
      # out python3. Inside the container it is the other way round — the image's own
      # interpreter is `python` — and ci/smoke.py invokes it accordingly.
      #
      # The gate holds no credential and reaches no external service: it invents its own
      # AUTH_PASSWORD, points MQTT_HOST at a `.invalid` name that RFC 2606 guarantees can never
      # resolve, and exposes nothing to anything. Its central premise is that the app survives
      # an unreachable broker — `mqtt_listener_loop()` is a background task with a reconnect
      # loop — and ci/smoke.py checks that premise explicitly rather than assuming it, so the
      # day it stops being true the failure says so in one line. Both containers it starts carry
      # $SMOKE_NAME, so concurrent runs on the shared daemon cannot collide and anything left
      # behind is removable by name.
      #
      # Step-level `timeout-minutes`, the one act_runner is known to enforce (the job-level one
      # is only the outer bound). 12 minutes is set against ci/smoke.py's OWN worst case, which
      # the script documents and sums from its individual bounds: 615 s — a little over 10
      # minutes — if every docker call it makes runs out its budget, the probe included. In
      # practice the whole gate is well under a minute. Being killed BY this timeout is what
      # the margin is for: the script's own container cleanup would not run, and the
      # `if: always()` step below is what catches that.
      timeout-minutes: 12
      env:
        # SMOKE_NAME is not here: it is set once at job level, so this step and the cleanup
        # step below are guaranteed to be talking about the same containers.
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The body of this step is byte-identical to the one in tests.yml. Only the `env:` values
      # above differ. The PR gate and the publishing gate must run the same checks against the
      # same kind of container, and the cheapest way to guarantee that is for the two to be
      # literally the same text — anything else drifts, and it drifts silently, in the
      # direction of the PR gate testing less.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Deliberately placed here and not at the top of the job: `docker build` runs arbitrary
      # RUN instructions from the Dockerfile — including an `npm ci` that executes whatever
      # install scripts the dependency tree carries — and the smoke step runs the image's own
      # code, both on a self-hosted runner shared with every other repository. Logging in only
      # now keeps the registry credentials out of the job's docker config for the whole
      # build-and-test stretch, which is precisely what the GHCR workflow this replaces did not
      # do.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # A PAT carrying the `write:package` scope, provided to this repository as a secret. The
        # built-in GITEA_TOKEN cannot be used in its place: it carries no package scope at all.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # 15 minutes for a python:3.11-slim base plus the wheels and the built frontend on top of
      # it. That is generous on a healthy link and meant to be: a bound too tight would abort a
      # push that was making perfectly good progress, leaving a half-pushed :<sha> and no
      # :latest.
      timeout-minutes: 15
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # `set -e` makes this step's central guarantee local to this step. The tag order
        # computed above is only worth anything if a failed `:<sha>` push STOPS the loop before
        # it reaches `:latest` — otherwise this file reproduces exactly the tag-order fault it
        # names the old GHCR workflow for: a moving `:latest` whose immutable twin, the only
        # rollback point, never reached the registry. WITHOUT this line that stop would rest on
        # act_runner invoking `run:` as `bash -e {0}` — a property of the runner's job image
        # and its defaults rather than of this file, and one a different image or a changed
        # default could silently take away.
        set -e
        # Split first, then count what the loop will actually iterate over. Checking the raw
        # string instead — `[ -n "$TAGS" ]` — tests it BEFORE word splitting, so a value of
        # nothing but whitespace passes the guard and still yields zero iterations and a green
        # step, which is the exact outcome this guard exists to forbid. `set --` applies the
        # same splitting the `for` below does, so `$#` is the number of tags that will really
        # be pushed.
        # This is also why there is no `-u` on the `set -e` above: $TAGS is set by this step's
        # own `env:`, and an expression that resolved to nothing arrives set-but-EMPTY rather
        # than unset, so `set -u` would never fire on it. The check below is what covers that
        # case. Without it a `Compute image tags` step that wrote no output would produce a
        # green push that published nothing, leaving `:latest` on the previous commit's image
        # while the run reported success — a silent no-op is worse here than a red job, being
        # indistinguishable from a deploy that worked.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # `always()`, and before the image cleanup below: this runner has one persistent docker
      # daemon shared by every repository, so a container left behind by a failed run would sit
      # there forever — and would also pin the image, making the `docker rmi` in the next step
      # fail.
      # ci/smoke.py removes both itself — the guard container before it starts it, the
      # long-lived one in a `finally` — so on a normal run this is a no-op. It exists for the
      # run where the step above was killed by its own timeout and never reached any of that.
      # BOTH suffixes are removed, not just the long-lived container: `--rm` disposes of a
      # container that EXITED, and the case this step is for is the container that did not.
      # When ci/smoke.py's own subprocess timeout fires it kills the docker client on the
      # runner, not the container on the daemon — so a hung guard survives its `--rm` and has
      # to be removed here, by the name ci/smoke.py gave it for exactly this purpose.
      # $SMOKE_NAME comes from the job-level `env:` — the same value the smoke step passed to
      # ci/smoke.py, not a second copy of the expression that could drift from it.
      if: always()
      run: |
        # The empty suffix is the long-lived container the HTTP checks run against; -guard is
        # the one the missing-environment check runs with `--rm`. Kept in step with
        # GUARD_SUFFIX in ci/smoke.py.
        # No `set -eu` here on purpose: this is best-effort cleanup, every removal already ends
        # in `|| true`, and failing the step would turn a leftover container into a red job.
        for suffix in "" -guard; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # The runner's docker daemon is persistent, so the images built here would otherwise pile
      # up and grow the disk forever. This step removes ONLY the tags this run created — no
      # `docker system prune`, which would also wipe the images of every other repo sharing the
      # same daemon, including containers other jobs are mid-run against.
      # It does NOT reclaim everything: `docker rmi <tag>` never touches the BuildKit cache
      # (that lives in a separate builder store and is only freed by `docker builder prune`),
      # and `--pull` above leaves the previous base images untagged as dangling images whenever
      # upstream publishes a new node:22-alpine or python:3.11-slim digest. Both need a
      # separate periodic cleanup on the runner host.
      # `always()` so the cleanup runs even when the smoke or the push above fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is legitimate HERE, unlike in the push step above, and is deliberately
        # not rejected. It can arise two ways, and neither leaves a tag for this loop to
        # remove. If `Compute image tags` FAILED, the build step never ran and nothing was
        # created at all. If it succeeded but wrote no output, the build ran without any
        # `--tag`, so the image it produced is untagged: dangling, unreachable by name, and
        # reclaimable only by the periodic prune on the runner host, never by this loop — and
        # that run still goes red, because the smoke step gets an empty SMOKE_IMAGE and
        # ci/smoke.py refuses to start.
        # Do not "fix" this symmetrically with the guard in the push step: there, publishing
        # nothing while reporting success is a silent deploy failure; here, removing nothing
        # when there is nothing to remove is the correct outcome.
        for tag in $TAGS; do docker rmi "$tag" || true; done
