name: Docker Image CI

# No `pull_request` trigger: this workflow pushes :latest, the tag production follows (the
# container carries `io.portainer.update.enable=true`, so Portainer redeploys whatever lands on
# it). PRs are covered by tests.yml, which runs the same tests, image build and gate but never
# logs in or pushes.
#
# Nobody approves anything between `docker push` and the rollout, so the smoke gate is the last
# point where a broken image can be stopped. Order: tests -> build -> smoke -> login -> push
# :<sha> then :latest.
#
# No `actions/setup-python`: it is unverified on this runner. Both test jobs run inside
# containers started by the same docker the build uses, so a passing test job also proves
# docker works on the runner.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea Actions —
# the built-in GITEA_TOKEN carries no package scope at all. The registry push below
# authenticates with the REGISTRY_TOKEN PAT (an organisation-level secret on `projects`,
# inherited by this repo) instead.
permissions:
  contents: read   # checkout

# Two pushes to the same branch in a row must not race: the runs are independent and the older
# one may finish last, leaving ITS :latest on the registry — the next poll by Portainer's
# updater would then ship the previous commit.
# The group alone already fixes that: runs are serialised, so the newest commit's :latest is
# written last. Cancelling is deliberately OFF — it would kill the older run together with its
# :<sha> image, and on two quick pushes the intermediate commit would never be built, leaving
# holes in the tag history exactly where a rollback is most likely to be needed.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Two separate test jobs so backend and frontend failures are reported and re-run
  # independently.
  backend-tests:
    runs-on: ubuntu-latest
    # The runner is shared by every repository in the fleet, so a hung step does not just stall
    # this run — it holds a capacity slot everyone else is queueing for. 25 is the outer bound
    # over the single 20-minute step below, leaving room for checkout: it must EXCEED the sum,
    # because act_runner kills the whole job when this fires.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the backend test suite in a container
      # 20 minutes is far above the real cost: `pip install` of six pinned runtime wheels plus
      # pytest/httpx, then 198 tests that touch no network and no disk outside tmp_path — a
      # couple of minutes cold. The bound is for a shared runner under load and for the pip
      # index having a bad day.
      timeout-minutes: 20
      env:
        # python:3.11-slim, the SAME base the Dockerfile's runtime stage uses. Testing under a
        # different interpreter than the one that ships would leave exactly the gap this whole
        # migration is about: a suite that is green on 3.12 and an image that runs 3.11.
        RUNTIME_IMAGE: python:3.11-slim
      run: |
        set -e
        set -o pipefail
        # The workspace is streamed in as a tar over stdin, not bind-mounted: this job runs
        # inside act_runner's job container while `docker` talks to the host's daemon, so a
        # `-v "$PWD:/src"` path would mean something else (or nothing) on the host. It also
        # keeps root-owned __pycache__ out of the checkout. `.git` is not needed by the tests.
        # `--pull always`: the daemon is persistent, so a cached base image would go unpatched.
        # The five variables make `server/src/settings.py` importable: AUTH_PASSWORD, MQTT_HOST,
        # INFLUX_URL and INFLUX_DB have no defaults, and COOKIE_SECURE must be false because Starlette's
        # TestClient speaks plain http, where a Secure cookie is dropped. conftest.py sets the
        # same with `setdefault`; they are spelled out here as the deployment contract.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e AUTH_PASSWORD=test-password \
          -e MQTT_HOST=localhost \
          -e INFLUX_URL=http://localhost:8086 \
          -e INFLUX_DB=test \
          -e COOKIE_SECURE=false \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r server/requirements-dev.txt; pytest --tb=short -q'

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the frontend test suite in a container
      # 20 minutes, dominated by `npm ci` pulling the dependency tree cold; vitest itself runs
      # the whole suite in a couple of seconds.
      timeout-minutes: 20
      env:
        # node:22-alpine, the SAME image the Dockerfile's frontend stage builds in. It matters
        # more here than for python: alpine is musl, so npm resolves the musl build of
        # rollup's native binary, and a test job on a glibc node would be exercising a
        # different toolchain than the one that produces the bundle that ships.
        FRONTEND_IMAGE: node:22-alpine
      run: |
        set -e
        set -o pipefail
        # Same tar-over-stdin reasoning as the backend job above.
        # `npx vitest run` is what package.json's "test" script runs.
        # The playwright suite in e2e/ is not run: it needs real browsers (a few hundred MB per
        # run on the shared runner) for three specs. vitest.config.ts excludes `e2e/**`.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e CI=true \
          "$FRONTEND_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; npm ci; npx vitest run'

  build:
    # Both suites must be green before an image is built at all: a build that starts while the
    # tests are still running is a build whose result nobody can act on, and on a shared runner
    # it is also a slot taken from a job that could have used it.
    needs: [ backend-tests, frontend-tests ]
    # `ubuntu-latest` is a LABEL, not a machine: the instance-level runner registered in Gitea
    # advertises it and serves every repository on the instance. Writing the runner's own name
    # here would leave the job queued forever, because no runner offers a label by that name.
    runs-on: ubuntu-latest
    # The three step-level timeouts below come to 47 minutes (20 build + 12 smoke + 15 push);
    # 55 leaves 8 on top for checkout, the registry login and the two cleanup steps. The outer
    # bound has to EXCEED the sum, not equal it: act_runner kills the whole job when this
    # fires, and a step marked `if: always()` is not guaranteed to run afterwards — so a job
    # that dies mid-push leaves the smoke containers and a few hundred MB of image sitting on
    # the daemon the entire fleet shares.
    timeout-minutes: 55
    # Job-level, so the smoke step (ci/smoke.py names its containers after it) and the cleanup
    # step (removes them by that name) cannot disagree. The run id keeps concurrent runs on the
    # shared daemon from colliding; ci/smoke.py refuses to start without this variable.
    env:
      SMOKE_NAME: smarthome-floorplan-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :<sha> + :latest (production follows :latest); any other branch -> :<branch>.
      # The `main` check below, the `branches:` filter at the top and the `pull_request` filter
      # in tests.yml must all name the real default branch; a mismatch fails silently (no
      # trigger, or no :latest ever produced).
      # workflow_dispatch can run off any ref, so the else branch must never produce a fixed
      # tag production deploys from.
      env:
        # Passed through the environment instead of being interpolated into the script text:
        # git allows `$`, backticks, quotes and parentheses in branch names, so a branch like
        # `feat/$(id)` would otherwise execute on the runner, which is self-hosted and shared
        # with every other repository on the instance.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase in repository names, docker image paths do not, so lowercase
        # $REPO. Deriving the path from $REPO keeps it in step with where the repo lives.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters and must not be "tidied up": the push step iterates over $TAGS
          # left to right, so :latest is pushed LAST and acts as the commit of the whole
          # publication. If :<sha> fails to push (network, registry quota, disk), the run stops
          # before :latest moves and production keeps running the previous image; the reverse
          # order could deploy a :latest whose immutable :<sha> rollback point never arrived.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The :<sha> one is
          # it — :latest is a moving target shared with whatever ran before, :<sha> can only
          # ever mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag: everything outside [A-Za-z0-9_.-]
          # (a `/` in feat/foo above all) becomes `-`, and the result is cut to 100 chars —
          # branch names have no length limit, docker rejects tags over 128. The `sed` fixes
          # the first character: docker requires a tag to match
          # [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}, so a branch like `-fix`, `(test)` or `+wip`
          # would otherwise produce a leading `-` and fail the build with `invalid reference
          # format`.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # The sanitiser passes a name through untouched when it already consists of legal
          # characters, so a branch literally named `latest` would come out as the production
          # tag and — one manual workflow_dispatch later — ship unreviewed code into the stack.
          # The `main` check above does not cover this: the branch is not `main`, it only
          # borrows its tag.
          # Reserved names are therefore prefixed instead of being used as-is.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's act_runner; the
      # job-level one above is only the outer bound. 20 minutes is well above a realistic cold
      # build, and this Dockerfile is the fleet's most expensive: stage one is node:22-alpine
      # doing `npm ci` over a lockfile of ~300 packages and then `vue-tsc -b && vite build`
      # (the type-check is part of the build, so a type error fails the image rather than
      # shipping), stage two is python:3.11-slim with six pinned wheels on top.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated into the script text: the only thing
        # standing between a branch name and command execution on the runner is the `tr` filter
        # in the step above. `$TAGS` below is intentionally unquoted — the tags are a
        # space-separated list and word splitting is exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted daemon is persistent, so cached node:22-alpine and
        # python:3.11-slim bases would otherwise go unpatched.
        # This is a BuildKit build (the `docker build` default since Engine 23.0); its cache
        # lives in a separate builder store the cleanup step cannot reclaim.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate sits between build and push: a red smoke means nothing reaches the registry
      # and production keeps the previous image.
      #
      # ci/smoke.py runs on the runner and drives `docker` for the container-level checks (no
      # environment, CMD/WORKDIR, still alive, logs); the HTTP checks run in a probe fed to
      # `docker exec -i <name> python -u -`, against 127.0.0.1:8000 inside the container.
      #
      # No port is published: this job runs inside act_runner's job container while `docker`
      # drives a daemon outside it, so a published port would not be reachable from here.
      #
      # The runner image has `python3` but no bare `python`; inside the container it is `python`.
      #
      # The gate holds no credential and reaches no external service: it invents AUTH_PASSWORD
      # and points MQTT_HOST at a `.invalid` name (RFC 2606). It relies on the app surviving an
      # unreachable broker and checks that explicitly.
      #
      # Step-level `timeout-minutes` is the one act_runner enforces. 12 minutes covers
      # ci/smoke.py's documented worst case of 615 s; if this timeout kills the step, the
      # `if: always()` cleanup below removes the containers.
      timeout-minutes: 12
      env:
        # SMOKE_NAME is not here: it is set once at job level, so this step and the cleanup
        # step below are guaranteed to be talking about the same containers.
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The body of this step is byte-identical to the one in tests.yml. Only the `env:` values
      # above differ. The PR gate and the publishing gate must run the same checks against the
      # same kind of container, and the cheapest way to guarantee that is for the two to be
      # literally the same text — anything else drifts, and it drifts silently, in the
      # direction of the PR gate testing less.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Placed after build and smoke: `docker build` runs arbitrary RUN instructions (including
      # npm install scripts) and the smoke step runs the image's code on a shared runner, so
      # registry credentials stay out of the docker config until now.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # A PAT carrying the `write:package` scope, provided to this repository as a secret. The
        # built-in GITEA_TOKEN cannot be used in its place: it carries no package scope at all.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # 15 minutes for a python:3.11-slim base plus the wheels and the built frontend on top of
      # it. That is generous on a healthy link and meant to be: a bound too tight would abort a
      # push that was making perfectly good progress, leaving a half-pushed :<sha> and no
      # :latest.
      timeout-minutes: 15
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # `set -e`: a failed `:<sha>` push must stop the loop before `:latest` moves. Explicit
        # here rather than relying on act_runner's `bash -e {0}` default.
        set -e
        # Split first, then count what the loop will iterate over (`[ -n "$TAGS" ]` would pass
        # whitespace). An empty $TAGS arrives set-but-empty, so `set -u` would not catch it;
        # this check turns "pushed nothing" into a red job instead of a fake deploy.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # `always()`, and before the image cleanup: the shared daemon is persistent, and a leftover
      # container would also pin the image and make `docker rmi` fail. ci/smoke.py removes both
      # containers itself, so this matters when the smoke step was killed by its timeout. Both
      # suffixes: a hung guard survives its `--rm` when only the docker client is killed.
      if: always()
      run: |
        # The empty suffix is the long-lived container the HTTP checks run against; -guard is
        # the one the missing-environment check runs with `--rm`. Kept in step with
        # GUARD_SUFFIX in ci/smoke.py.
        # No `set -eu` here on purpose: this is best-effort cleanup, every removal already ends
        # in `|| true`, and failing the step would turn a leftover container into a red job.
        for suffix in "" -guard; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes only the tags this run created (no `docker system prune`: the daemon is shared).
      # The BuildKit cache and dangling base images left by `--pull` need a separate periodic
      # cleanup on the runner host. `always()` so it runs even when smoke or push fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is legitimate here, unlike in the push step: with no tags there is
        # nothing tagged to remove (and such a run is already red, since ci/smoke.py refuses
        # an empty SMOKE_IMAGE).
        for tag in $TAGS; do docker rmi "$tag" || true; done
