# A readable record of what is deployed, not the file the deployment is applied from: the live
# service runs as a Portainer-managed stack and is edited in Portainer's stack editor. Where this
# file differs from the running container on purpose, the difference is named here:
#   1. every environment value is a placeholder (see the `environment:` block);
#   2. the deployment also carries an `EDIT_PASSWORD` variable, which this file omits: no such
#      setting exists in server/src/settings.py (`Settings` has `extra="ignore"`, so the app
#      drops it);
#   3. the `image:` line names the Gitea registry, which is where .gitea/workflows/ publishes.
# Everything else — the container name, the volume, the labels, the absence of a healthcheck —
# matches the running container.

volumes:
  # Declared as `data`: compose prefixes volume names with the project name, so this produces
  # the `smarthome_floorplan_data` volume the running container has. Any other name would start
  # the service with an empty data directory.
  data:

networks:
  # Traefik picks this container up through its docker provider, but it can only route to it if
  # the two share a network. `external: true` means compose expects it to exist already; it is
  # not created or destroyed with this stack.
  docker_main_net:
    external: true

services:
  smarthome_floorplan:
    # Built by .gitea/workflows/image-check-publish.yml, gated on ci/smoke.py, then pushed as
    # :<sha> followed by :latest.
    image: gitea.vvzvlad.xyz/projects/smarthome_floorplan:latest
    # Underscore, matching the running container: `docker logs`, `docker exec`, the wiki and the
    # runbooks refer to the service by this name.
    container_name: smarthome_floorplan
    restart: always
    volumes:
      # /app/data is where `config_path` (data/config.json) and `icon_path` (data/icon.png)
      # resolve to, since WORKDIR is /app and both are declared as relative paths. This mount is
      # the entire persistent state of the service — the floorplan itself lives in that JSON.
      - data:/app/data
    environment:
      # No real values here: all four are set in the Portainer stack. AUTH_PASSWORD and
      # MQTT_HOST are required (`Settings` has no default for them), so a stack without either
      # fails at import and the container never starts; ci/smoke.py checks this on every build.
      AUTH_PASSWORD: XXX
      MQTT_HOST: XXX
      APP_TITLE: XXX
      TZ: XXX
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    # Label values are quoted strings throughout. Docker labels are strings by definition, and
    # compose rejects a bare `true` or `8000` as "invalid type" under some schema versions —
    # quoting costs nothing and removes a way for this file to fail to apply.
    labels:
      traefik.enable: "true"
      # Router and service are both named `smarthome_floorplan`, matching the running container.
      traefik.http.routers.smarthome_floorplan.rule: "Host(`sh.asakusa-lab.cc`)"
      traefik.http.routers.smarthome_floorplan.entrypoints: "websecure"
      traefik.http.routers.smarthome_floorplan.tls: "true"
      traefik.http.routers.smarthome_floorplan.tls.certresolver: "letsEncrypt"
      # The mixed casing `loadBalancer` / `loadbalancer` reproduces the running container.
      # Traefik parses these label paths case-insensitively, so both land on the same setting.
      traefik.http.services.smarthome_floorplan.loadBalancer.server.port: "8000"
      traefik.http.services.smarthome_floorplan.loadbalancer.server.scheme: "http"
      # Auto-update: Portainer's ContainerAutomation.AutoUpdate polls for a new :latest and
      # redeploys on it. Safe only because the CI gate stands between the build and :latest.
      io.portainer.update.enable: "true"
    # No healthcheck, matching the running container. Traefik will not route to a container whose
    # health is `starting` or `unhealthy`, so adding one changes behaviour: add it to the
    # deployment first. /api/info is the right endpoint (unauthenticated, touches neither MQTT nor
    # the data volume), with an interval in seconds and a start_period that covers startup.
